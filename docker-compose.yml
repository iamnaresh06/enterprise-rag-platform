version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Relational Database: MySQL 8.0
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: rag_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-enterprise_rag_db}
      MYSQL_USER: ${DB_USER:-rag_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rag_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rag_root_secret_2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Asynchronous Task Broker & Semantic Cache: Redis 7.0
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Django REST Framework API Gateway (Backend)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Ingestion & Vectorization Worker (Backend)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info --concurrency=2
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
